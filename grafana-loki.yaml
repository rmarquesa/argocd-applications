# helm repo add grafana-community https://grafana-community.github.io/helm-charts --force-update
# helm search repo grafana-community/loki --versions | more
#
# Chunks e index vao para o MinIO (S3). O PVC local guarda apenas WAL e cache.
# Credenciais S3 via secret loki-s3-credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 18.7.4
    chart: loki
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
            s3:
              endpoint: http://minio.minio-lab.svc.cluster.local:9000
              region: us-east-1
              s3ForcePathStyle: true
              insecure: true
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 168h
          compactor:
            retention_enabled: true
            delete_request_store: s3
            retention_delete_delay: 2h
            compaction_interval: 10m
        singleBinary:
          replicas: 1
          extraEnvFrom:
            - secretRef:
                name: loki-s3-credentials
          persistence:
            enabled: true
            storageClass: longhorn-monitoring
            size: 5Gi
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
