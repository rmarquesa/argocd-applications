# helm repo add grafana-community https://grafana-community.github.io/helm-charts --force-update
# helm search repo grafana-community/grafana --versions | more
#
# Observability UI. All four datasources are provisioned, so nothing has to be
# wired by hand after a fresh install:
#
#   Prometheus    metrics   (default -- see note next to it)
#   Loki          logs
#   Tempo         traces
#   Alertmanager  alerts fired by Prometheus rules
#
# They are cross-linked, which is what makes an investigation flow instead of
# being four separate tools:
#   log line  -> trace   via Loki derivedFields (regex on the trace id)
#   span      -> logs    via tracesToLogsV2
#   span      -> metrics via tracesToMetrics and the service map
#   metric    -> trace   via Prometheus exemplars
#
# This Grafana is the only one in the cluster: the Grafana bundled with
# kube-prometheus-stack is disabled there, and its dashboards are imported by
# the sidecar configured below.
#
# Ingress notes:
#   - ingressClassName MUST be "traefik" (see `kubectl get ingressclass`).
#     A name that matches no IngressClass makes Traefik silently ignore the
#     Ingress: ADDRESS stays empty and Traefik answers 404.
#   - The host MUST live under *.apps.l3softwares.local, otherwise external-dns
#     ignores it (--domain-filter=apps.l3softwares.local) and DNS returns NXDOMAIN.
#   - No spec.tls on purpose: Traefik's default TLSStore already serves a
#     wildcard cert covering *.apps.l3softwares.local. The two router
#     annotations are what put this Ingress on the HTTPS entrypoint.
#   - root_url must be set explicitly, otherwise Grafana builds absolute links
#     as http://<host>:3000/ and login redirects break behind the proxy.
#
# Admin credentials live in the grafana-admin Secret, created out of band so
# they are never committed here. Without it the chart generates a new random
# password on every helm upgrade, while the admin row inside the persisted
# database keeps the old one -- the Secret and the actual login silently drift
# apart. Create it once, before the first sync:
#
#   kubectl create secret generic grafana-admin -n monitoring \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 24)"
#
# Read it back with:
#
#   kubectl get secret grafana-admin -n monitoring \
#     -o jsonpath='{.data.admin-password}' | base64 -d
#
# If the Secret is rotated after the database already exists, Grafana will not
# pick up the new value on its own -- reset it inside the pod:
#
#   kubectl exec -n monitoring deploy/grafana -- \
#     grafana cli --homepath /usr/share/grafana admin reset-admin-password '<password>'

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 12.10.3
    chart: grafana
    helm:
      releaseName: grafana
      valuesObject:
        # Credentials from the out-of-band Secret (see header for the command).
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        # kube-prometheus-stack ships its dashboards as ConfigMaps labelled
        # grafana_dashboard. This sidecar imports them, which is what lets us
        # disable the Grafana bundled with that chart and still get its
        # dashboards. searchNamespace ALL because they are created in whichever
        # namespace that release lives in.
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            searchNamespace: ALL
            folderAnnotation: grafana_folder
            provider:
              foldersFromFilesStructure: true
        persistence:
          enabled: true
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          path: /
          pathType: Prefix
          hosts:
            - grafana.apps.l3softwares.local
          tls: []
        # Loki ships as the default datasource. It is a single-tenant install
        # (auth_enabled: false), so no X-Scope-OrgID header is required.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              # Prometheus is the default: the dashboards shipped by
              # kube-prometheus-stack resolve their datasource by default and
              # break if that turns out to be Loki.
              - name: Prometheus
                type: prometheus
                uid: prometheus
                access: proxy
                url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
                isDefault: true
                jsonData:
                  timeInterval: 30s
                  # Exemplars carry a trace id on a metric sample, turning a
                  # latency spike into a link to the trace behind it.
                  exemplarTraceIdDestinations:
                    - name: trace_id
                      datasourceUid: tempo
              - name: Alertmanager
                type: alertmanager
                uid: alertmanager
                access: proxy
                url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
                jsonData:
                  implementation: prometheus
                  handleGrafanaManagedAlerts: false
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                jsonData:
                  # Keep in sync with the Loki retention_period (168h).
                  maxLines: 1000
                  # Turn a trace id found in a log line into a link to Tempo.
                  # The regex must match how the id appears in the log body.
                  derivedFields:
                    - name: TraceID
                      matcherRegex: "trace_?[iI][dD][\"=:\\s]+([a-f0-9]{32})"
                      url: "$${__value.raw}"
                      datasourceUid: tempo
              - name: Tempo
                type: tempo
                uid: tempo
                access: proxy
                url: http://tempo.monitoring.svc.cluster.local:3200
                jsonData:
                  # Jump from a span back to the logs of the same service and
                  # time window. Tags map span attributes to Loki labels.
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: "-5m"
                    spanEndTimeShift: "5m"
                    filterByTraceID: true
                    tags:
                      - key: service.name
                        value: service_name
                  # Span -> RED metrics for the same service.
                  tracesToMetrics:
                    datasourceUid: prometheus
                    spanStartTimeShift: "-5m"
                    spanEndTimeShift: "5m"
                    tags:
                      - key: service.name
                        value: service
                  # Service graph, built from metrics generated by Tempo.
                  serviceMap:
                    datasourceUid: prometheus
        grafana.ini:
          server:
            root_url: https://grafana.apps.l3softwares.local
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
