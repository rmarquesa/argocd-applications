# helm repo add grafana-community https://grafana-community.github.io/helm-charts --force-update
# helm search repo grafana-community/grafana --versions | more
#

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 12.10.3
    chart: grafana
    helm:
      releaseName: grafana
      valuesObject:
        persistence:
          enabled: true
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          path: /
          pathType: Prefix
          hosts:
            - grafana.apps.l3softwares.local
          tls: []
        # Loki ships as the default datasource. It is a single-tenant install
        # (auth_enabled: false), so no X-Scope-OrgID header is required.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
                isDefault: true
                jsonData:
                  # Keep in sync with the Loki retention_period (168h).
                  maxLines: 1000
        grafana.ini:
          server:
            root_url: https://grafana.apps.l3softwares.local
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
