# helm repo add minio https://charts.min.io/ --force-update
# helm search repo minio/minio --versions | more
#
# Cluster-wide object storage. Every application gets its own bucket, its own
# user and a policy scoped to that bucket only -- the loki user cannot read
# postgres backups, and vice versa. To onboard a new app, add one entry to
# each of buckets/policies/users below. Nothing else changes.
#
# Secrets never live in this file: each user points at a Secret that already
# exists in the minio-lab namespace (existingSecret/existingSecretKey). This
# repository is public.
#
# Storage layout:
#   - Single node (mode: standalone). No HA: if the pod dies there is downtime
#     until it is rescheduled. Accepted trade-off for this cluster.
#   - Backed by StorageClass longhorn-minio -> diskSelector "minio" -> the
#     dedicated 100GB scsi2 disk on worker-1. MinIO requires local block
#     storage; never place it on NFS.
#
# Consumers:
#   - CloudNativePG (Barman) writes to s3://postgres-backups/ using access key
#     barman-7a9d9c1267d2. Changing that key breaks the ObjectStore in
#     postgres-lab, which references secret s3-backup-credentials.
#   - Loki writes chunks and index to s3://loki-chunks/ and s3://loki-ruler/.
#   - Tempo writes trace blocks to s3://tempo-traces/.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    targetRevision: 5.4.0
    chart: minio
    helm:
      releaseName: minio
      valuesObject:
        mode: standalone
        replicas: 1
        existingSecret: minio-root-credentials
        persistence:
          enabled: true
          storageClass: longhorn-minio
          size: 90Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        # Buckets, policies and users are created by post-install Helm hooks.
        # ArgoCD deletes those Jobs once they succeed, so they will not show up
        # in `kubectl get jobs`.
        buckets:
          - name: postgres-backups
            policy: none
            purge: false
          - name: loki-chunks
            policy: none
            purge: false
          - name: loki-ruler
            policy: none
            purge: false
          - name: tempo-traces
            policy: none
            purge: false
        policies:
          - name: postgres-backups-rw
            statements:
              - resources:
                  - "arn:aws:s3:::postgres-backups"
                  - "arn:aws:s3:::postgres-backups/*"
                actions:
                  - "s3:*"
          - name: loki-rw
            statements:
              - resources:
                  - "arn:aws:s3:::loki-chunks"
                  - "arn:aws:s3:::loki-chunks/*"
                  - "arn:aws:s3:::loki-ruler"
                  - "arn:aws:s3:::loki-ruler/*"
                actions:
                  - "s3:*"
          - name: tempo-rw
            statements:
              - resources:
                  - "arn:aws:s3:::tempo-traces"
                  - "arn:aws:s3:::tempo-traces/*"
                actions:
                  - "s3:*"
        users:
          - accessKey: barman-7a9d9c1267d2
            existingSecret: barman-s3-credentials
            existingSecretKey: ACCESS_SECRET_KEY
            policy: postgres-backups-rw
          - accessKey: loki
            existingSecret: loki-s3-credentials
            existingSecretKey: AWS_SECRET_ACCESS_KEY
            policy: loki-rw
          - accessKey: tempo
            existingSecret: tempo-s3-credentials
            existingSecretKey: AWS_SECRET_ACCESS_KEY
            policy: tempo-rw
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
